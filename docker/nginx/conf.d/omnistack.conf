# =============================================================================
# OmniStack — server blocks
# =============================================================================
# Two listeners:
#   :8080   plain HTTP, health probe + 301 redirect to HTTPS. NOT published to
#           the host -- it exists so the Docker healthcheck can probe without a
#           TLS handshake, and so a stray http:// gets redirected.
#   :58443  TLS, the real site. This IS the only published port.
#
# IPv4 ONLY on purpose. `listen [::]:8080` aborts startup with
#   [emerg] socket() [::]:58443 failed (97: Address family not supported by
#           protocol)
# on any Docker network created without IPv6 enabled -- which is the default.
# Since the published port is loopback-bound, IPv6 buys nothing here anyway.
# To re-enable, first create the network with `enable_ipv6: true` in
# compose, then add the `listen [::]:...` lines back.
#
# ============================ PORT CONTRACT ================================
# The container port and the published host port MUST stay identical (58443).
# That is deliberate, and it is what makes the redirect below correct:
# `$host` has the port STRIPPED, so a hardcoded `:58443` is the only way to
# build an absolute https:// URL here. If the two ports ever diverge, the
# redirect silently points at a port nothing is listening on.
# Change HTTPS_PORT in .env and this `listen` together, or not at all.
# ===========================================================================
# =============================================================================

# -----------------------------------------------------------------------------
# :8080 — health probe + redirect
# -----------------------------------------------------------------------------
server {
  listen      8080;
  server_name _;

  # Plain HTTP by design: the Docker healthcheck must not have to negotiate TLS,
  # validate a self-signed cert, or fail closed on expiry. It probes this.
  location = /healthz {
    access_log off;

    # NOTE: no `add_header Content-Type text/plain;` here. `return 200 "<str>"`
    # already sets Content-Type: text/plain, so adding it again emits the
    # header TWICE. This is not cosmetic -- see README §5.0.
    return 200 "ok\n";
  }

  # Catch-all: force TLS. `absolute_redirect off` stops nginx from appending
  # $server_port (which would be 8080, the container's own port) to the
  # Location header -- the port is written out explicitly instead, per the port
  # contract above.
  location / {
    absolute_redirect off;
    return 301 https://$host:58443$request_uri;
  }
}

# -----------------------------------------------------------------------------
# :8443 — TLS
# -----------------------------------------------------------------------------
server {
  listen      58443 ssl;
  http2       on;      # 1.25.1+ syntax; the old `listen 8443 ssl http2` is deprecated
  server_name _;

  root  /usr/share/nginx/html;
  index index.html;

  # -----------------------------------------------------------------------------
  # TLS
  # -----------------------------------------------------------------------------
  # Certs are bind-mounted read-only from ./docker/certs. Generate them first:
  #   ./scripts/gen-dev-certs.sh
  # `ssl_reject_handshake on` is NOT used: an unrecognised SNI silently closing
  # the connection is far harder to debug than a wrong-but-readable response.
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  ssl_protocols             TLSv1.2 TLSv1.3;
  ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;   # clients already prefer AEAD + forward secrecy
  ssl_session_cache         shared:SSL:10m;
  ssl_session_timeout       1d;
  ssl_session_tickets       off;   # no ticket key rotation, so tickets stay off

  # OCSP stapling is OFF. It needs a publicly-trustable certificate that
  # publishes an OCSP responder AND a `resolver` directive. With the default
  # self-signed cert it produces a repeating error-log storm and buys nothing.
  # To enable with Let's Encrypt, uncomment all three lines below and set
  # `resolver` to a real resolver.
  # ssl_stapling            on;
  # ssl_stapling_verify     on;
  # resolver                1.1.1.1 1.0.0.1 valid=300s;
  # resolver_timeout        5s;

  # -----------------------------------------------------------------------------
  # Security headers
  # -----------------------------------------------------------------------------
  # Deliberately NOT written inline here. They live in a snippet so that every
  # `location` below which adds its own `add_header` can re-include them --
  # `add_header` replaces the whole inherited set rather than merging. See the
  # header of snippets/security-headers.conf.
  include /etc/nginx/snippets/security-headers.conf;

  # -----------------------------------------------------------------------------
  # Rate limiting — DISABLED BY DEFAULT
  # -----------------------------------------------------------------------------
  # A single Next.js page load fires ~30-60 parallel asset requests. At
  # `rate=30r/s burst=60 nodelay` a cold-cache first paint can exceed the burst
  # and start returning 429 on the app's own JS/CSS, which reads as a broken
  # app rather than as throttling.
  #
  # To enable once this is actually serving real traffic:
  #   1. delete the two limit_*_status lines (they are http/server-context only)
  #   2. uncomment the three below
  #   3. first run with `limit_req_dry_run on;` to LOG what would be blocked
  #      without blocking it, check `docker compose logs` for real 429s
  #
  # limit_req_status  429;
  # limit_conn_status 429;
  # limit_req  zone=general burst=60 nodelay;
  # limit_conn addr 50;

  # -----------------------------------------------------------------------------
  # Static asset caching
  # -----------------------------------------------------------------------------
  # Hashed by the build -> safe to cache forever, and safe to delete when the
  # filename changes.
  location /_next/static/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
    log_not_found off;
    try_files $uri =404;
  }

  # Public/ assets: fonts, images. Not content-hashed, so a short cache only.
  # NOTE: this regex is evaluated BEFORE the /_next/static/ prefix, because
  # nginx checks regex locations after prefix ones. That is why the security
  # snippet is re-included above rather than inherited.
  location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000" always;
    access_log off;
    log_not_found off;
    try_files $uri =404;
  }

  # -----------------------------------------------------------------------------
  # Hardening
  # -----------------------------------------------------------------------------
  # Secrets and VCS metadata must never be served. Static export emits none of
  # these, so this is defence in depth against a future stray copy into ./out.
  location ~ /\.(?!well-known) {
    deny all;
    access_log off;
    log_not_found off;
  }

  # Certbot HTTP-01 needs this reachable over plain HTTP; the negative lookahead
  # in the rule above exists so this exception can exist at all.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  # Scanning noise: 403 instead of 404 for paths that are never valid here.
  location ~* /(?:wp-admin|wp-login|xmlrpc\.php|\.env|\.git|phpmyadmin) {
    deny all;
    access_log off;
    log_not_found off;
  }

  # -----------------------------------------------------------------------------
  # Health probe over TLS too (used by the README verification curl)
  # -----------------------------------------------------------------------------
  location = /healthz {
    include /etc/nginx/snippets/security-headers.conf;
    access_log off;
    return 200 "ok\n";
  }

  # -----------------------------------------------------------------------------
  # Routing
  # -----------------------------------------------------------------------------
  # The order of $uri.html and $uri/ matters, and getting it wrong costs a
  # redirect on EVERY route.
  #
  # What `output: "export"` + `trailingSlash: true` actually emits, verified
  # against the built image:
  #     out/projects/index.html   <- exists
  #     out/projects.html         <- does NOT exist
  #
  # So `$uri/` as an early step is a trap: for the request `/projects`, that
  # resolves to the DIRECTORY /projects/, and nginx answers a directory hit with
  # a 301 to the slash-terminated form. Result: /projects -> 301 -> /projects/
  # -> 200, an extra round trip on every single navigation, and a 301 that a
  # browser is entitled to cache.
  #
  # Dropping $uri/ makes /projects resolve straight to /projects/index.html.
  # `$uri` is still tried first so real files (assets, favicon.ico) short-circuit.
  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }

  # `output: "export"` already emits a 404.html, so serve it with a real 404
  # status instead of a bare body-less error. Note the ordering trap this avoids:
  # ending try_files with `/404.html` instead of `=404` would serve that page
  # with HTTP 200, telling clients and search engines the URL is valid.
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
