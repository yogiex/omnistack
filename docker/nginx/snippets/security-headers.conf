# =============================================================================
# OmniStack — security headers (single source of truth)
# =============================================================================
# INCLUDE THIS FILE IN EVERY `location` BLOCK THAT SERVES CONTENT.
#
# WHY THIS FILE EXISTS — the single most common nginx security bug:
#
#   `add_header` does NOT merge. A `location` block that declares even ONE
#   `add_header` REPLACES the entire inherited set from the parent `server`
#   block. So this naive pattern silently drops every header:
#
#     server { add_header X-Frame-Options "DENY" always;   # <- inherited...
#              location /_next/static/ {
#                add_header Cache-Control "...immutable"; # <- ...and GONE
#      } }
#
#   Result: every hashed asset is served with NO nosniff, NO HSTS, NO CSP.
#   Fix: include this snippet in each location that adds its own header.
#
# Verify it actually works:
#   curl -kI https://localhost:8443/_next/static/<any>.js | grep -iE 'hsts|nosniff'
# =============================================================================

# -----------------------------------------------------------------------------
# Strict-Transport-Security
# -----------------------------------------------------------------------------
# LOCAL / SELF-SIGNED DEFAULT: short max-age on purpose.
#
# HSTS is NOT overridable in the browser. Once a browser caches this header for
# a host, that host becomes HTTPS-only FOREVER -- `curl -k` and "Proceed anyway"
# will both refuse to work, and the only escape is manually deleting browser
# profile state. With `max-age=63072000; preload` on a self-signed *local* cert,
# one stray visit can brick `localhost:8443` for two years with no recovery path.
#
# For real public production, uncomment the strong policy below -- but only once
# the certificate is genuinely valid and served on a real domain.
#
# add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

add_header Strict-Transport-Security "max-age=300" always;

# -----------------------------------------------------------------------------
# Content-Security-Policy
# -----------------------------------------------------------------------------
# 'unsafe-inline' is genuinely required here and cannot be removed:
#   - mock-previews.ts embeds an inline <script> (Realtime Collab preview)
#   - the AI Architect preview panel renders an iframe via srcDoc
#   - next-themes injects a blocking inline script to avoid a theme flash (FOUC)
# Getting rid of it would need per-request nonces, which requires a dynamic
# server. That is fundamentally incompatible with a static export.
#
# frame-ancestors 'none' = this site may not be embedded by anyone.
# frame-src 'self'     = but we may embed our own pages (AI Architect preview).
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-src 'self'; upgrade-insecure-requests" always;

# -----------------------------------------------------------------------------
# Clickjacking / MIME sniffing / referrer leakage
# -----------------------------------------------------------------------------
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# -----------------------------------------------------------------------------
# Permissions-Policy — switch off browser features this app never uses.
# `interest-cohort` is FLoC-era and obsolete, kept because it is harmless and
# some corporate proxies still check for its presence.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# -----------------------------------------------------------------------------
# Legacy XSS auditor. No-op in every current browser (it was REMOVED from
# Chrome/Firefox/Edge because it introduced holes rather than closing them).
# Harmless, kept only for ancient clients. The real XSS defence is the CSP above.
add_header X-XSS-Protection "1; mode=block" always;

# -----------------------------------------------------------------------------
# Cross-origin isolation. COOP severs the window.opener handle (tabnabbing);
# CORP stops other origins from loading our assets. No COEP is set on purpose:
# it would break the Dicebear avatar images.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
