# =============================================================================
# OmniStack — nginx main config
# =============================================================================
# Serves the Next.js static export. No Node runtime, no upstream, no proxy.
# Everything the container can write is redirected into a tmpfs, because
# compose mounts the root filesystem read_only.
# =============================================================================

# -----------------------------------------------------------------------------
# NOT `user nginx;`
# -----------------------------------------------------------------------------
# `user` is valid only in the main context, but it is also USELESS here and
# actively harmful: it only takes effect when the master runs as root, and
# compose pins `user: "101:101"` with `cap_drop: [ALL]`. Leaving it in makes
# nginx abort at startup with:
#   [emerg] "user" directive makes sense only if the master process runs
#           with super-user privileges
# The image already runs master+worker as uid 101, so the directive is dropped.
# -----------------------------------------------------------------------------

# NOT `auto`. This host has 12 cores, so `auto` would fork 12 workers inside a
# container capped at 0.5 CPU / 128 MB -- guaranteed memory pressure, and it
# would also ignore the cgroup CPU limit entirely. One worker is ample for
# serving pre-baked files off local disk.
worker_processes 1;

# Raise the fd ceiling to match worker_connections. Without this, nginx warns at
# startup when worker_connections exceeds the 1024 default RLIMIT_NOFILE.
worker_rlimit_nofile 4096;

# Logs to stderr (captured by `docker logs`), not to a file on the read-only fs.
error_log /dev/stderr warn;

# /var/run is a tmpfs in compose. It MUST be mode 1777, not 755: the master
# runs as uid 101 and mode 755 would leave the directory unwritable for it.
pid /var/run/nginx.pid;

events {
  # 1024, not 4096. Static file serving needs one fd per open connection and
  # almost no per-connection memory, but 4096 connections against a 0.5 CPU /
  # 128 MB budget just trades CPU starvation for a number that will never be
  # reached. Tune this UP together with worker_rlimit_nofile if you raise the
  # cgroup limits.
  worker_connections 1024;

  # Accept new connections in one pass instead of one accept() per loop.
  multi_accept on;
}

http {
  # -----------------------------------------------------------------------------
  # Writable paths
  # -----------------------------------------------------------------------------
  # These five directives are REJECTED in the main context -- nginx raises
  #   [emerg] "client_body_temp_path" directive is not allowed here
  # -- so they must live inside `http`. They are set explicitly (rather than
  # relying on the compiled-in /var/cache/nginx defaults) so the read-only
  # contract is visible in one place: /var/cache/nginx is a tmpfs in compose.
  client_body_temp_path /var/cache/nginx/client_temp;
  proxy_temp_path       /var/cache/nginx/proxy_temp;
  fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
  uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
  scgi_temp_path        /var/cache/nginx/scgi_temp;

  # Required so .css/.js/.svg/... get correct Content-Type. With
  # `X-Content-Type-Options: nosniff` a wrong type is fatal, not cosmetic.
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # -----------------------------------------------------------------------------
  # Logging
  # -----------------------------------------------------------------------------
  # stdout, not a file. `buffer=16k flush=5s` batches writes so a burst of asset
  # requests does not turn into one syscall per line.
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" rt=$request_time uct="$upstream_connect_time"';

  access_log /dev/stdout main buffer=16k flush=5s;

  # -----------------------------------------------------------------------------
  # Performance
  # -----------------------------------------------------------------------------
  sendfile            on;   # kernel copies file -> socket, no user-space bounce
  tcp_nopush          on;   # fill packets before sending; fewer tiny segments
  tcp_nodelay         on;   # ...but never delay an interactive response
  aio                 off;  # sendfile already covers this; aio+sendfile is a no-op
  directio            off;  # static files are small; directio would HURT them

  keepalive_timeout   65;
  keepalive_requests  1000;

  # Metadata cache: avoids a stat() syscall per request per file.
  # open_file_cache_valid is 30s, not the usual 60-120s, because a short value
  # is what makes a newly written ./out file visible quickly during iteration.
  open_file_cache          max=1000 inactive=30s;
  open_file_cache_valid    30s;
  open_file_cache_min_uses 1;
  open_file_cache_errors   on;  # negative-cache 404s too; harmless at 30s

  reset_timedout_connection on;

  # -----------------------------------------------------------------------------
  # Timeouts & request size
  # -----------------------------------------------------------------------------
  # Tight values are cheap anti-slowloris protection. A static site legitimately
  # needs nothing more than a body upload, and there is no upload endpoint here.
  client_body_timeout    12s;
  client_header_timeout  12s;
  send_timeout           10s;
  client_max_body_size   1m;
  client_body_buffer_size 16k;

  # Hide the version on every response and on generated error pages.
  server_tokens off;

  # -----------------------------------------------------------------------------
  # Compression
  # -----------------------------------------------------------------------------
  gzip              on;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_comp_level   5;     # 5 is the CPU/ratio sweet spot; 6+ costs more than it returns
  gzip_min_length   256;   # below this the header overhead exceeds the saving
  gzip_types
      text/plain
      text/css
      text/xml
      application/javascript
      application/json
      application/manifest+json
      application/xml
      application/xml+rss
      image/svg+xml;

  # NOT listed: text/html -- nginx always compresses it, so naming it here only
  # emits `[warn] duplicate MIME type "text/html"`.
  # NOT listed: image/jpeg, image/png, image/webp, image/avif -- already
  # compressed; gzip makes them larger and burns CPU for nothing.
  gzip_disable "msie6";

  # -----------------------------------------------------------------------------
  # Rate limiting (zones only -- see conf.d/omnistack.conf for why the
  # enforcement is commented out by default)
  # -----------------------------------------------------------------------------
  limit_req_zone  $binary_remote_addr zone=general:10m rate=30r/s;
  limit_conn_zone $binary_remote_addr zone=addr:10m;

  # -----------------------------------------------------------------------------
  # Site config
  # -----------------------------------------------------------------------------
  include /etc/nginx/conf.d/*.conf;
}
