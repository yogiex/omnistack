worker_processes 1;
# NOT `auto`: the host has 12 cores, so `auto` would fork 12 workers, each with
# its own cache/connection memory. The container is capped at 64 MB.
# One worker is plenty for serving pre-baked static files off local disk.

# No `user` directive: the image already runs master+worker as uid 101, and
# setuid requires privileges the container does not have.

# The root filesystem is mounted read-only by compose, with a tmpfs at /tmp only.
# nginx mkdir()s its temp dirs at startup and aborts if that fails, so every
# writable path is redirected into the single writable location. `pid` and
# `error_log` are legal in the main context; the five *_temp_path directives are
# NOT, and are therefore set inside the http block below.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  # All five of these are rejected in the main context -- "directive is not
  # allowed here" -- so they must live in the http block. Same reason each is
  # pinned to /tmp: it is the only writable path under read_only: true.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # Needed for correct Content-Type on .css/.js/.svg. A wrong or missing type
  # interacts badly with X-Content-Type-Options: nosniff and would also break
  # style-src/script-src matching below.
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile    on;
  tcp_nopush  on;
  # No brotli: the module is not compiled into this image, and referencing it
  # would make nginx refuse to start.

  gzip              on;
  gzip_vary         on;   # send Vary: Accept-Encoding so caches don't mix encodings
  gzip_min_length   1024; # below this the compression header costs more than it saves
  gzip_proxied      any;
  gzip_types        text/css application/javascript application/json image/svg+xml;
  # text/html is deliberately absent: nginx always compresses it, so listing it
  # here only produces a "duplicate MIME type" warning.

  server {
    listen      8080;   # unprivileged port; the image is already configured for it
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # Emit relative Location headers. With an absolute redirect nginx would
    # bake in the :8080 it listens on, which is wrong behind a proxy on :80.
    absolute_redirect off;

    # Excluded from the security headers below: plain text, no framing, no
    # need to be protected. Kept free of side effects so the healthcheck is cheap.
    location = /healthz {
      access_log off;
      # No explicit Content-Type: `return 200 "<string>"` already sets
      # `text/plain`, so an add_header here would emit the header twice.
      return 200 "ok\n";
    }

    # Content-hashed filenames: a redeploy changes the name, so a cached copy
    # can never be stale. Safe to cache for a year.
    location /_next/static/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      # nginx's add_header does not merge across levels: any add_header in a
      # location cancels the inherited set from the server block. The security
      # headers must therefore be repeated here verbatim.
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
      add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https://api.dicebear.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-src 'self'" always;
    }

    # HTML must never be served stale from cache, or a redeploy stays invisible
    # to anyone who already visited the page. `immutable` would be exactly
    # wrong here. `no-cache` is chosen over `max-age=0, must-revalidate`
    # because they are nearly equivalent, but no-cache is the form browsers
    # and shared proxies handle most predictably: the body may be stored, yet
    # every request revalidates via ETag/Last-Modified and gets a 304 when
    # unchanged. Storage is kept, bandwidth is saved, staleness is impossible.
    location / {
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
      add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https://api.dicebear.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-src 'self'" always;

      # next.config.ts sets trailingSlash: true, so every page is a real
      # directory containing index.html (/projects -> out/projects/index.html),
      # which is what makes this try_files chain resolve all 31 routes.
      # A catch-all rewrite to index.html is deliberately absent: a genuinely
      # missing page should 404 rather than silently render the home page.
      try_files $uri $uri/ $uri/index.html;
    }
  }
}

# ─── Runtime templating: deliberately none ────────────────────────────────
# NEXT_PUBLIC_* values are inlined into the asset URLs and client bundle at
# `next build` time. Swapping the value afterwards would change nothing in the
# already-built output, so a runtime-templated nginx.conf could not make it
# take effect either. It is also actively dangerous: the image entrypoint runs
# envsubst over *.template and conf.d files, and a bare `envsubst` with no
# shell-argument list substitutes every nginx runtime variable too -- $uri,
# $host, $request_uri would all be blanked, silently corrupting this config.
# Hence: this file is fully static and starts as-is.
